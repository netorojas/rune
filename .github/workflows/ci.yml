name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Contratos do servidor
        run: python -m unittest discover -s tests -v

      - name: Sintaxe do painel
        run: |
          node --check app.js
          node --check i18n.js

      - name: Cobertura i18n
        run: node tests/test_i18n.mjs
